appId: io.github.andreazero.nexusai
productName: Nexus AI
asar: true
protocols:
  - name: Nexus AI account sign-in
    schemes:
      - io.github.andreazero.nexusai
directories:
  output: ../../release/${os}
files:
  - dist/**
  - resources/**
  - package.json
  - '!node_modules/@openai/**'
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../../.nexus/runtime/codex
    to: codex
    filter:
      - '**/*'
  - from: ../web/dist
    to: renderer
    filter:
      - '**/*'
artifactName: Nexus-AI-${version}-${os}-${arch}.${ext}
win:
  icon: resources/icon.ico
  target:
    - target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  # Local packages have no developer certificate. Apple Silicon still needs an
  # ad-hoc signature; the explicit signed release helper overrides these values.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  binaries:
    - Contents/Resources/codex/bin/codex
    - Contents/Resources/codex/codex-path/rg
  target:
    - target: dmg
linux:
  icon: resources/icon.png
  category: Development
  target:
    - target: AppImage
publish: null
